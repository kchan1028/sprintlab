name: GitHub Pages

# Publishes the demo at https://kchan1028.github.io/sprintlab/ on every push to main.
# Cloudflare Pages keeps deploying separately; see docs/deployment.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build for the /sprintlab/ subpath
        run: npx vite build
        env:
          BASE_PATH: /sprintlab/
          # No Pages Function here, so the app doesn't ask for the AI drafter.
          VITE_AI_DRAFTER: 'off'
      # GitHub Pages has no SPA fallback: serving index.html as the 404 page lets deep links reload.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
