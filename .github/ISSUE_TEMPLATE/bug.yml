name: Bug report
description: Something does not work as expected
labels: ["type: bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and version
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options: [Blocking, Major, Minor]
    validations:
      required: true

  - type: textarea
    id: requirement-impact
    attributes:
      label: Related requirement and documentation impact
      description: Link the PRODUCT.md or roadmap.md section, or state what is missing. Never include secrets or real project data.
